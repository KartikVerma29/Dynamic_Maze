<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Dynamic Maze</title>
    <style>
      body {
        margin: 0;
        background-color: #111; /* Dark grey background */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      /* Gives the game a nice subtle glow and a crisp border */
      canvas {
        border: 2px solid #444; 
        box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.8); 
      }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    
    <script type='text/javascript'>
      var Module = {
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          return canvas;
        })()
      };
    </script>
    
    {{{ SCRIPT }}}
  </body>
</html>
