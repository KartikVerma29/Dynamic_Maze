<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Dynamic Maze</title>
    <style>
  body {
    margin: 0;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    padding: 30px; 
    box-sizing: border-box;
  }
  
  canvas.emscripten {
    width: 100vw;
    height: 100vh;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 16 / 9; 
    object-fit: contain;
    border: 4px solid #555; 
    border-radius: 8px;
    box-shadow: 0px 0px 40px rgba(0, 0, 0, 0.9); 
  }
</style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    
    <script type='text/javascript'>
      var Module = {
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          return canvas;
        })()
      };
    </script>
    
    {{{ SCRIPT }}}
  </body>
</html>
